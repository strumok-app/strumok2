name: content_suppliers_rust
description: flutter_rust_bridge bindings for the external Rust content supplier bundle (spec-02).
version: 4.0.0
publish_to: 'none'

environment:
  sdk: ^3.8.0

dependencies:
  content_suppliers_api:
    path: ../content_suppliers_api
  # Must stay compatible with Rust-side codegen 2.12.0 (spec-02 §2.1).
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^3.0.0
  logging: ^1.3.0

dev_dependencies:
  build_runner: ^2.4.0
  freezed: ^3.0.0
  lints: ^6.0.0
  test: ^1.25.0
