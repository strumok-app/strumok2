name: strumok
description: "Strumok: ad-free media app for movies, series, anime and manga."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cached_network_image: ^4.0.6
  content_suppliers_api:
    path: packages/content_suppliers_api
  content_suppliers_rust:
    path: packages/content_suppliers_rust
  device_info_plus: ^13.3.0
  # Exact pin: per-profile isolation uses firebase_dart implementation classes (lib/features/auth/data/firebase_apps.dart).
  file_selector: ^1.1.0
  firebase_dart: 1.6.2
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.5.0
  flutter_foreground_task: ^11.0.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  google_sign_in: ^7.2.0
  googleapis_auth: ^2.3.7
  http: ^1.6.0
  http2: ^3.2.0
  intl: ^0.20.3
  logging: ^1.3.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  riverpod_annotation: ^4.0.8
  screen_brightness: ^2.1.11
  sembast: ^3.10.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  # 0.5.x: 0.6 is a rewrite on top of nativeapi with a different API.
  volume_controller: ^3.7.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.10
  build_runner: ^2.17.1
  shared_preferences_platform_interface: ^2.4.2
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  # Upscaling shaders (spec-13): desktop only, so Android builds don't carry them.
  assets:
    - path: assets/shaders/anime4k/
      platforms: [linux, windows]
    - path: assets/shaders/custom/
      platforms: [linux, windows]
