name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build -d

      - name: Analyze
        run: |
          flutter analyze
          (cd packages/content_suppliers_api && dart analyze)
          (cd packages/content_suppliers_rust && dart analyze)

      - name: Test
        run: flutter test
